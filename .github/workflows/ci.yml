name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tricklecrypt -> target
      - name: Formatting
        run: cargo fmt --manifest-path tricklecrypt/Cargo.toml --all -- --check
      - name: Tests
        run: cargo test --manifest-path tricklecrypt/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path tricklecrypt/Cargo.toml --all-targets -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path tricklecrypt/Cargo.toml --no-deps

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tricklecrypt -> target
      - name: Build for Cortex-M4F
        run: cargo check --manifest-path tricklecrypt/Cargo.toml --target thumbv7em-none-eabihf
